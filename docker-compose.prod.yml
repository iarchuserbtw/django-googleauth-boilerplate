services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    env_file:
      - .env.prod

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    # Сделать images а не build
    build:
      context: .
      dockerfile: Dockerfile
      target: prod

    restart: unless-stopped

    env_file:
      - .env.prod

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_data: