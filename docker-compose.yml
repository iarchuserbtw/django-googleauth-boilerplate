services:
  db:
    image: postgres:16-alpine
    
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  api:
    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_data: